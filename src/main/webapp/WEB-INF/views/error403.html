<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>MoroccoCraft — Accès refusé</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f0e8;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .box {
            background: #fff;
            border-radius: 16px;
            padding: 64px 48px;
            max-width: 480px;
            border: 1px solid #e8e0d4;
        }
        .code {
            font-family: 'Playfair Display', serif;
            font-size: 80px;
            color: #8b4513;
            line-height: 1;
            margin-bottom: 16px;
        }
        h1 { font-family: 'Playfair Display', serif; font-size: 24px; color: #1a0f0a; margin-bottom: 12px; }
        p  { color: #7a6a5a; font-size: 15px; line-height: 1.6; margin-bottom: 32px; }
        a  {
            display: inline-block;
            padding: 12px 28px;
            background: #8b4513;
            color: #fff;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }
        a:hover { background: #6b3410; }
    </style>
</head>
<body>
    <div class="box">
        <div class="code">403</div>
        <h1>Accès refusé</h1>
        <p>Vous n'avez pas les droits nécessaires pour accéder à cette page.<br>
           Seuls les administrateurs peuvent y accéder.</p>
        <a href="LoginController">← Retour à l'accueil</a>
    </div>
</body>
</html>
